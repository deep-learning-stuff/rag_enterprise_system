services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor de embeddings: sirve BGE-M3 por HTTP. El backend lo llama; no lo
  # exponemos al host salvo el puerto 8080 para poder depurarlo con curl.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    # max-batch-tokens bajo (4096) para que el warmup en CPU sea rápido. Es un ajuste
    # de rendimiento/arranque, no de calidad; en GPU/producción se sube.
    command: ["--model-id", "BAAI/bge-m3", "--max-batch-tokens", "4096"]
    ports:
      - "8080:80"
    volumes:
      - tei_data:/data  # cachea el modelo descargado (~2.3 GB) entre reinicios

  # Reranker: mismo software (TEI) pero otro modelo. Reordena los candidatos del
  # retrieval con más criterio y da una nota de relevancia para el umbral.
  # Modelo configurable: por defecto uno ligero multilingüe que corre en cualquier
  # equipo. En una máquina con más RAM (o GPU) se pone el grande vía RERANKER_MODEL
  # en el .env (ver README). El backend no se entera: solo cambia qué modelo sirve TEI.
  reranker:
    # cpu-1.9 (más nueva que la de embeddings): el modelo grande no trae ONNX, así que
    # TEI cae a su backend nativo Candle, y en 1.7 eso segfaultea (Intel MKL / SGEMM).
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - "--model-id"
      - "${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}"
      - "--max-batch-tokens"
      - "4096"
    ports:
      - "8081:80"
    volumes:
      - reranker_data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@db:5432/${POSTGRES_DB:-rag}
      EMBEDDINGS_URL: http://embeddings:80
      RERANKER_URL: http://reranker:80
      # Tamaño de ventana de rerank. Debe ir acorde al modelo que sirve el reranker:
      # ~450 con el ligero (512 tokens), ~7000 con bge-reranker-v2-m3 (8192).
      RERANKER_WINDOW_TOKENS: ${RERANKER_WINDOW_TOKENS:-450}
      # Generación (Fase 5): LLM en la nube, configurable por .env (ver .env.example).
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started
      reranker:
        condition: service_started
    volumes:
      - ./backend:/app
      # Cachea la descarga del tokenizer de BGE-M3 para no repetirla en cada reinicio.
      - hf_cache:/root/.cache/huggingface

  frontend:
    build: ./frontend
    environment:
      # Nombre del servicio backend dentro de la red de compose (para el proxy de Vite)
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  hf_cache:
  tei_data:
  reranker_data:
