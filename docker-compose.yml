services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor de embeddings: sirve BGE-M3 por HTTP. El backend lo llama; no lo
  # exponemos al host salvo el puerto 8080 para poder depurarlo con curl.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    # max-batch-tokens bajo (4096) para que el warmup en CPU sea rápido. Es un ajuste
    # de rendimiento/arranque, no de calidad; en GPU/producción se sube.
    command: ["--model-id", "BAAI/bge-m3", "--max-batch-tokens", "4096"]
    ports:
      - "8080:80"
    volumes:
      - tei_data:/data  # cachea el modelo descargado (~2.3 GB) entre reinicios

  # Reranker: mismo software (TEI) pero otro modelo. Reordena los candidatos del
  # retrieval con más criterio y da una nota de relevancia para el umbral.
  # Modelo configurable por RERANKER_MODEL en el .env; el backend no se entera.
  #
  # IMPORTANTE (imagen CPU): esta imagen sirve los rerankers vía ONNX Runtime, así que el
  # modelo DEBE traer un onnx/model.onnx en su repo. Los que solo traen safetensors fallan
  # al arrancar (no hay fallback a Candle en CPU). Por eso se usan repos ...-ONNX.
  #   - Actual (CPU):  onnx-community/gte-multilingual-reranker-base  (~306M, rápido, Apache-2.0)
  #   - Alt. CPU:      onnx-community/bge-reranker-v2-m3-ONNX  (más preciso, ~2.3x más lento)
  #
  # Si algún día hay GPU: cambiar esta imagen a un tag de GPU (p.ej. turing-1.9 / 86-1.9 /
  # hopper-1.9 según la tarjeta) + añadir el passthrough de GPU (deploy.resources...devices,
  # driver nvidia). En GPU TEI usa Candle+CUDA y carga safetensors directamente, así que se
  # puede poner el modelo grande y preciso BAAI/bge-reranker-v2-m3 SIN ONNX ni hacks.
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - "--model-id"
      - "${RERANKER_MODEL:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}"
      - "--max-batch-tokens"
      - "4096"
    ports:
      - "8081:80"
    volumes:
      - reranker_data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rag}:${POSTGRES_PASSWORD:-rag}@db:5432/${POSTGRES_DB:-rag}
      EMBEDDINGS_URL: http://embeddings:80
      RERANKER_URL: http://reranker:80
      # Tamaño de ventana de rerank. Debe ir acorde al modelo que sirve el reranker:
      # ~450 con el ligero (512 tokens), ~7000 con bge-reranker-v2-m3 (8192).
      RERANKER_WINDOW_TOKENS: ${RERANKER_WINDOW_TOKENS:-450}
      # Generación (Fase 5): LLM en la nube, configurable por .env (ver .env.example).
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # El --reload de uvicorn vigila /app con watchfiles vía inotify. Sobre el bind
      # mount en Docker Desktop/WSL2 eso agota los watchers del kernel y el reloader
      # muere ("Cannot allocate memory / os error 12"), dejando de recargar los cambios.
      # Con polling watchfiles sondea los ficheros y esquiva inotify por completo.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started
      reranker:
        condition: service_started
    volumes:
      - ./backend:/app
      # Cachea la descarga del tokenizer de BGE-M3 para no repetirla en cada reinicio.
      - hf_cache:/root/.cache/huggingface

  frontend:
    build: ./frontend
    environment:
      # Nombre del servicio backend dentro de la red de compose (para el proxy de Vite)
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  hf_cache:
  tei_data:
  reranker_data:
